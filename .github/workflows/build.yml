name: Build APK

on:
  push:
    branches: [main]
    # Only changes to the app itself make a new release. README, licence, badges
    # and CI edits don't, so Obtainium and the F-Droid repo only see real updates.
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      version: ${{ steps.name.outputs.version }}
      apk: ${{ steps.name.outputs.apk }}
    steps:
      # Third-party actions are pinned to exact commits (the comment shows the version).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=1" >> "$GITHUB_ENV"
          else
            # Never publish a debug-signed release: without the key the build (and release) stops here.
            echo "::error title=Unsigned build::KEYSTORE_BASE64 is not set - refusing to build a debug-signed release"
            exit 1
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as an annotation so they're visible without opening the logs.
            msg=$(grep -E "^e: |What went wrong|error:|FAILED" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      # Remove the key as soon as signing is done, even if the build failed,
      # so no later step (or action) can read it.
      - name: Delete signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=" >> "$GITHUB_ENV"

      - name: Name APK and check signature
        id: name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build.${{ github.run_number }}"
          APK="FrigateCtrl-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate DN" | sed 's/^[^:]*: //')
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256" | sed 's/^.*: //')
          echo "Signed by: $CERT"
          if [ "$RELEASE_SIGNED" != "1" ] || echo "$CERT" | grep -q "Android Debug"; then
            echo "::error title=Signing failed::The APK is not release-signed - check the key alias and passwords"
            exit 1
          fi
          echo "::notice title=Signed APK::$APK signed by $CERT (SHA-256 $SHA)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FrigateCtrl-apk
          path: ${{ steps.name.outputs.apk }}
          if-no-files-found: error

  # Separate job with no access to the signing secrets; it only gets the finished APK.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # full history and tags, for the release notes

      - name: Write release notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FrigateCtrl-apk

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: FrigateCtrl ${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ needs.build.outputs.apk }}
          body_path: ${{ runner.temp }}/notes.md
