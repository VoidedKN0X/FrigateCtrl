name: Feature request
description: Suggest an idea for FrigateCtrl
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
  - type: textarea
    id: other
    attributes:
      label: Anything else?
